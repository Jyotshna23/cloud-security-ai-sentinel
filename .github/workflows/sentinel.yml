name: Cloud Security AI Sentinel

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and Smoke Test FastAPI Docker Container
        run: |
          docker build -t ai-sentinel:latest .
          docker run -d -p 8000:8000 --name sentinel-api ai-sentinel:latest
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/health

      - name: Stop and Clean Up Docker Container
        if: always()
        run: |
          docker stop sentinel-api || true
          docker rm sentinel-api || true

      - name: Run AI Sentinel Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sentinel.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json history.json index.html
          git commit -m "Update sentinel results [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
