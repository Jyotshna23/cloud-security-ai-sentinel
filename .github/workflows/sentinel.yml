name: Cloud Security AI Sentinel
on:
schedule:
- cron: '0 */6 * * *'
workflow_dispatch:
permissions:
contents: write
jobs:
run-sentinel:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'
cache: 'pip'
- name: Install dependencies
run: |
python -m pip install --upgrade pip
pip install -r requirements.txt
- name: Build and Smoke Test FastAPI Docker Container
run: |
docker build -t ai-sentinel:latest .
docker run -d -p 8000:8000 --name sentinel-api ai-sentinel:latest
sleep 3
curl --fail http://localhost:8000/health
docker stop sentinel-api
docker rm sentinel-api
- name: Run AI Sentinel Scan
run: python sentinel.py
env:
GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
